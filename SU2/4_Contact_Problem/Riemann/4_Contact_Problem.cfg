%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 Riemann (4-Contact)					               %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------------------- 物理與數學模型 ------------------------- %
% 既然是氣體動力學，我們不需要考慮黏性（摩擦力），直接召喚歐拉大神！
SOLVER= EULER
MATH_PROBLEM= DIRECT

% ------------------------- 初始條件 (障眼法) ------------------------- %
% 因為黎曼問題是四宮格，SU2 預設的設定檔給不出這麼酷的東西。
% 所以我們設定從「重啟檔 (Restart File)」開始跑。
% 之後我們會用 Python 偷塞一個四宮格檔案騙它這就是起點。
RESTART_SOL= NO
READ_BINARY_RESTART= NO
RESTART_ITER= 1

% 下面這些是自由流 (Freestream) 的預設值，因為我們用了重啟檔，
% 這些數值其實只是寫給 SU2 看心安的，隨便填就好，它不會真的拿去用。
MACH_NUMBER= 0.0
AOA= 0.0
FREESTREAM_TEMPERATURE= 288.15
FREESTREAM_PRESSURE= 101325.0

% ------------------------- 邊界條件 ------------------------- %
% 把我們剛剛在網格裡命名的四個邊界，全部設定為無黏性牆壁。
% 這樣波撞到邊界就會像撞到彈珠台一樣反彈，很療癒！
MARKER_EULER= ( Bottom, Top, Right, Left )

% ------------------------- 時間設定 (重點！) ------------------------- %
% 黎曼問題是隨時間變化的，所以開啟非恆定 (Unsteady) 模式。
TIME_DOMAIN= YES
% 對付震波，用顯式龍格-庫塔 (Runge-Kutta) 法最穩，像步兵一樣一步一腳印。
TIME_MARCHING= TIME_STEPPING
% 時間步長 (dt)，越小越穩，但跑越久。我們先設個保守值。
TIME_STEP= 0.001
% 總共要跑幾步？跑 200 步看看波形散開的樣子。
TIME_ITER= 200

% ------------------------- 數值方法 (靈魂所在) ------------------------- %
% 要精準捕捉震波，絕對不能用預設的 JST，請務必指名使用 ROE 格式！
CONV_NUM_METHOD_FLOW= ROE
% 用二階精度會比較精準，一階太糊了。
MUSCL_FLOW= YES
% 但二階在震波附近容易產生數值震盪（也就是數值爆炸），所以要加個「限制器 (Limiter)」。
% Venkatakrishnan 限制器就像是避震器，能有效壓制爆炸。
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN

% Courant Number (CFL)：這決定了運算的步子邁得有多大。
% 設 0.5 是個安全牌，如果跑到一半發散（噴 NaN），就把這個數字調小！
CFL_NUMBER= 0.5

% ------------------------- 輸入/輸出設定 ------------------------- %
% 吃進去的網格檔 (剛剛我們手刻的那個)
MESH_FILENAME= 4_Contact_Problem.su2
MESH_FORMAT= SU2

% 每跑幾步要輸出一張圖？(設 10 代表總共 200 步會產出 20 個畫面，夠你做動畫了)
OUTPUT_WRT_FREQ= 1000

% 輸出的格式。雖然你沒有 GUI，但我們還是輸出 PARAVIEW (VTK) 格式，
% 這樣檔案很乾淨，稍後用 Python 讀取畫圖也方便。
OUTPUT_FILES= (RESTART, CSV)

% 存檔的檔名前綴
VOLUME_FILENAME= flow
SOLUTION_FILENAME= solution_flow.csv
